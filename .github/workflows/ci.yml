name: CI

on:
  push:
    branches: [ master, '001-pokemon-compiler-language' ]
  pull_request:
    branches: [ master, '001-pokemon-compiler-language' ]

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run Unit and E2E Tests
        run: pnpm test -- --run
      - name: Build web
        run: pnpm build
