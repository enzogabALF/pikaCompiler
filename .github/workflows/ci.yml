name: CI

on:
  push:
    branches: [ main, '001-pokemon-compiler-language' ]
  pull_request:
    branches: [ main ]

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install web deps
        working-directory: web
        run: |
          npm ci
      - name: Run web tests
        working-directory: web
        run: npm test --silent
